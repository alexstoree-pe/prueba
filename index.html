<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribución VIP | Alex Store</title>

    <link rel="icon" type="image/webp" href="https://alexstoree-pe.github.io/tienda-alex/catalogo/img/logo.webp">
    <link rel="apple-touch-icon" href="https://alexstoree-pe.github.io/tienda-alex/catalogo/img/logo.webp">
    <meta name="apple-mobile-web-app-title" content="Alex Distribución">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050505">

    <meta property="og:title" content="Distribución VIP | Alex Store">
    <meta property="og:description" content="Precios exclusivos para distribuidores. Panel de servicios streaming 24/7.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alexstoree-pe.github.io/tienda-alex/catalogo/distribuidores/"> 
    <meta property="og:image" content="https://alexstoree-pe.github.io/tienda-alex/catalogo/img/logo.webp">

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary: #00d4ff; 
        --dark: #050505;
        --glass: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --danger-neon: #ff0000;
        --vip: #d4af37;
        --success-neon: #39ff14;
        --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    }

    html { background-color: var(--dark); scroll-behavior: smooth; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
        font-family: 'Poppins', sans-serif; 
        background: #0a0a0a; 
        color: white; 
        padding-bottom: 200px; 
        overflow-x: hidden;
        visibility: hidden;
    }

    /* --- CORRECCIÓN CRÍTICA PARA EL BUSCADOR --- */
    #lista-productos {
        display: flex !important;
        flex-direction: column;
        width: 100%;
    }
    
    /* Aseguramos que en modo lista las tarjetas ocupen todo el ancho */
    .container:not(.grid-mode) .service-link {
        width: 100% !important;
    }

    /* Clase para ocultar lo que no coincide */
    .oculto-busqueda { 
        display: none !important; 
    }

    /* Clase para lo encontrado: Anulamos AOS que causa que se vean vacías o mal posicionadas */
    .encontrado-busqueda {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
    }
    /* ------------------------------------------- */

    .modal-pass { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); z-index: 9999; justify-content: center; align-items: center; visibility: visible; }
    .modal-content-pass { background: #111; padding: 40px; border-radius: 40px; width: 90%; max-width: 400px; border: 1px solid var(--primary); text-align: center; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }

    header { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); padding: 10px 15px 0px; text-align: center; border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 2000; }
    .brand-logo { width: 45px; height: 45px; object-fit: contain; border-radius: 18px; margin-bottom: 5px; }
    header h1 { font-size: 1.1rem; letter-spacing: 0.9px; margin-bottom: 5px; }

    .garantia-header { display: flex; justify-content: center; gap: 15px; margin-top: 5px; }
    .garantia-mini-item { text-align: center; min-width: 60px; }
    .garantia-mini-item i { font-size: 0.7rem; color: var(--primary); margin-bottom: 2px; }
    .garantia-mini-item p { font-size: 0.35rem; font-weight: 700; text-transform: uppercase; color: #bbb; line-height: 1.1; }

    .search-container { position: sticky; top: 110px; z-index: 1900; padding: 5px 15px; background: #0a0a0a; }
    .search-wrapper { position: relative; max-width: 500px; margin: auto; }
    .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
    #buscador { width: 100%; padding: 8px 15px 8px 40px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-family: 'Poppins'; transition: 0.3s; }
    #buscador:focus { border-color: var(--primary); outline: none; background: rgba(255,255,255,0.05); }

    .grid-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px auto; max-width: 500px; padding: 0 15px; }
    .btn-universal { display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 15px; text-decoration: none; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; border: none; cursor: pointer; transition: 0.3s; }
    .btn-inicio { background: var(--glass); color: #fff; border: 1px solid var(--glass-border); }
    .btn-promo-distri { background: var(--gold-gradient); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
    .btn-iptv { background: var(--gold-gradient); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
    .contenedor-iptv { display: flex; justify-content: center; padding: 0 15px; margin-top: -8px; margin-bottom: 20px; }

    .container { padding: 10px 15px; max-width: 600px; margin: auto; }
    .category-title { margin: 35px 0 15px; font-size: 0.9rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }

    .service-link { position: relative; text-decoration: none; color: inherit; display: block; margin-bottom: 30px; cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .service-card { background: #0f0f0f; border-radius: 25px; padding: 22px; display: flex; align-items: center; border: 1px solid var(--glass-border); gap: 18px; transition: 0.3s; position: relative; z-index: 10; overflow: hidden; }

    .service-link.premium .service-card { border: 2px solid var(--vip) !important; box-shadow: 0 0 15px rgba(212, 175, 55, 0.15); }
    .service-link.selected .service-card { transform: scale(0.96) translateY(2px) !important; background: rgba(255, 255, 255, 0.03) !important; }
    .service-link.selected:not(.premium) .service-card { border: 2px solid var(--primary) !important; box-shadow: 0 0 25px rgba(0, 212, 255, 0.5); }
    
    .check-icon { position: absolute; top: -5px; right: -5px; width: 28px; height: 28px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 0.9rem; z-index: 101; border: 2px solid #000; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    .service-link.selected .check-icon { display: flex !important; background: var(--primary) !important; color: #000 !important; }

    .badge-oferta { display: none; position: absolute; top: 0; left: 0; background: #f1c40f; color: #000; padding: 3px 20px 3px 10px; clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%); font-size: 0.55rem; font-weight: 900; z-index: 100; text-transform: uppercase; }
    .service-link.oferta .badge-oferta { display: block; }
    .premium-text { display: none; border: 1px solid #bf953f; padding: 2px 8px; border-radius: 4px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; margin-right: 15px; margin-bottom: 4px; }
    .premium .premium-text { display: inline-block; }

    .status-badge { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; margin-top: 5px; margin-bottom: 2px; display: flex; align-items: center; gap: 5px; }
    .disponible .status-badge::before { content: "● DISPONIBLE"; color: var(--success-neon); }

    .service-logo { width: 65px; height: 65px; object-fit: cover; border-radius: 18px; }
    .service-text h3 { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .manual-desc { font-size: 0.75rem; color: #888; display: block; }
    
    .price-container { display: flex; flex-direction: column; align-items: flex-end; margin-left: auto; }
    .price-tag { color: var(--primary); font-weight: 800; font-size: 1.4rem; }
    .premium .price-tag { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: var(--vip); }

    .badge-renovacion { display: none; color: #f1c40f; font-size: 0.55rem; font-weight: 700; margin-top: 3px; text-transform: uppercase; }
    .renovacion .badge-renovacion { display: inline-block; }

    .service-link.agotado { pointer-events: none; opacity: 0.3; filter: grayscale(1); }

    .floating-btn { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #25d366, #128c7e); color: white; padding: 0; border-radius: 22px; width: 92%; max-width: 480px; z-index: 3000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
    .cart-content-wrapper { display: flex; align-items: center; width: 100%; height: 70px; }
    .btn-send-order { flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; cursor: pointer; height: 100%; }

    .view-controls { display: flex; justify-content: flex-end; align-items: center; gap: 10px; max-width: 600px; margin: 5px auto; padding: 0 15px; }
    .view-btn { background: var(--glass); border: 1px solid var(--glass-border); color: #666; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; }
    .view-btn.active { background: var(--primary); color: #000; }

    #back-to-top { position: fixed; bottom: 110px; right: 20px; width: 45px; height: 45px; background: var(--primary); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; z-index: 2500; border: none; box-shadow: 0 0 15px rgba(0, 212, 255, 0.5); opacity: 0; visibility: hidden; transition: 0.4s; }
    #back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }

    .container.grid-mode { display: grid !important; gap: 15px !important; grid-template-columns: repeat(2, 1fr) !important; }
    .grid-mode .service-card { flex-direction: column; text-align: center; padding: 15px 10px; height: 100%; }
    .grid-mode .service-logo { width: 60px; height: 60px; margin-bottom: 10px; }
    .grid-mode .price-container { margin-left: 0; margin-top: 10px; align-items: center; }
</style>

<script>
    (function() {
        const acceso = sessionStorage.getItem("acceso_distribuidor");
        if (acceso === "true") {
            document.documentElement.style.visibility = "visible";
            document.addEventListener("DOMContentLoaded", () => { document.body.style.visibility = "visible"; });
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                const modal = document.getElementById('modal-login-distribuidor');
                if (modal) { modal.style.display = 'flex'; document.body.style.visibility = 'hidden'; modal.style.visibility = 'visible'; }
            });
        }
    })();
</script>
</head>

<body>
<button id="back-to-top"><i class="fas fa-chevron-up"></i></button>

<div id="modal-login-distribuidor" class="modal-pass">
    <div class="modal-content-pass">
        <h2 style="color:var(--primary); font-weight: 800;">ACCESO PRIVADO</h2>
        <div class="input-wrapper" style="margin: 20px 0;">
            <input type="password" id="input-dist-pass" maxlength="8" onkeydown="if(event.key==='Enter') validarAcceso()">
        </div>
        <button onclick="validarAcceso()" class="btn-universal btn-promo-distri" style="width:100%; padding:20px; border-radius:25px;">ENTRAR</button>
        <div id="error-msg" style="color: red; margin-top: 10px; font-size: 0.8rem;"></div>
    </div>
</div>

<header data-aos="fade-down">
    <img src="../img/logo.webp" class="brand-logo">
    <h1>SOLO DISTRIBUIDORES</h1>
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="buscador" placeholder="Buscar plataforma..." onkeyup="filtrarPlataformas()">
        </div>
    </div>
    <div class="view-controls">
        <button class="view-btn active" id="btn-list" onclick="cambiarDiseno('lista')"><i class="fa-solid fa-list"></i></button>
        <button class="view-btn" id="btn-grid" onclick="cambiarDiseno('cuadricula')"><i class="fa-solid fa-table-cells-large"></i></button>
    </div>
</header>

<div class="container" id="lista-productos">

    <div class="category-title" data-aos="fade-right">ZONA PERFILES</div>

    <div class="service-link premium disponible" onclick="toggleSeleccion(this)" data-aos="fade-up">
        <div class="service-card">
            <span class="badge-oferta">Mas solicitado 🔥</span>
            <div class="check-icon"><i class="fa-solid fa-check"></i></div>
            <img src="../img/netflix.webp" class="service-logo">
            <div class="service-text">
                <h3 class="nombre-prod">Netflix Perfil</h3>
                <span class="manual-desc">Ultra HD 4K • 1 Pantalla • Renovable.</span>
            </div>
            <div class="price-container">
                <span class="price-tag precio-prod">S/ 12</span>
            </div>
        </div>
    </div>

    <div class="service-link disponible" onclick="toggleSeleccion(this)" data-aos="fade-up">
        <div class="service-card">
            <div class="check-icon"><i class="fa-solid fa-check"></i></div>
            <img src="../img/disneys.webp" class="service-logo">
            <div class="service-text">
                <h3 class="nombre-prod">Disney standar Perfil</h3>
                <span class="manual-desc">Calidad 4K • PIN privado.</span>
            </div>
            <div class="price-container">
                <span class="price-tag precio-prod">S/ 4</span>
            </div>
        </div>
    </div>

    <div class="service-link disponible oferta" onclick="toggleSeleccion(this)" data-aos="fade-up">
        <div class="service-card">
            <span class="badge-oferta">🔥 Oferta</span>
            <div class="check-icon"><i class="fa-solid fa-check"></i></div>
            <img src="../img/paramount.webp" class="service-logo">
            <div class="service-text">
                <h3 class="nombre-prod">PARAMOUNT Perfil</h3>
                <span class="manual-desc">Premium • Estrenos exclusivos.</span>
            </div>
            <div class="price-container">
                <span class="price-tag precio-prod">S/ 2</span>
            </div>
        </div>
    </div>

</div>

<div id="whatsapp-btn" class="floating-btn">
    <div class="cart-content-wrapper">
        <div class="btn-send-order" onclick="enviarPedido()">
            <span><span id="cart-count">0</span> PEDIR WHATSAPP</span>
            <span id="cart-total">S/ 0.00</span>
        </div>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 800, once: true });

    function validarAcceso() {
        if (document.getElementById('input-dist-pass').value.toLowerCase() === "dis") {
            sessionStorage.setItem("acceso_distribuidor", "true");
            location.reload();
        } else {
            document.getElementById('error-msg').innerText = "PIN INCORRECTO";
        }
    }

    // --- FUNCIÓN DE BUSQUEDA CORREGIDA ---
    function filtrarPlataformas() {
        const input = document.getElementById('buscador').value.trim().toLowerCase();
        const tarjetas = document.querySelectorAll('.service-link');
        const titulos = document.querySelectorAll('.category-title');

        tarjetas.forEach(tarjeta => {
            const nombre = tarjeta.querySelector('.nombre-prod')?.innerText.toLowerCase() || "";
            const desc = tarjeta.querySelector('.manual-desc')?.innerText.toLowerCase() || "";
            
            if (input === "") {
                tarjeta.classList.remove('oculto-busqueda', 'encontrado-busqueda');
                tarjeta.style.order = "0";
            } else if (nombre.includes(input) || desc.includes(input)) {
                tarjeta.classList.remove('oculto-busqueda');
                tarjeta.classList.add('encontrado-busqueda');
                tarjeta.style.order = "-1"; 
            } else {
                tarjeta.classList.add('oculto-busqueda');
                tarjeta.classList.remove('encontrado-busqueda');
                tarjeta.style.order = "0";
            }
        });

        titulos.forEach(titulo => {
            titulo.style.display = (input !== "") ? "none" : "flex";
        });

        if (typeof AOS !== 'undefined') AOS.refresh();
    }

    function cambiarDiseno(modo) {
        const c = document.querySelector('.container');
        if (modo === 'cuadricula') c.classList.add('grid-mode');
        else c.classList.remove('grid-mode');
        AOS.refresh();
    }

    function toggleSeleccion(el) {
        el.classList.toggle('selected');
        reconstruirCarrito();
    }

    let carrito = [];
    function reconstruirCarrito() {
        carrito = [];
        document.querySelectorAll('.service-link.selected').forEach(el => {
            carrito.push({
                nombre: el.querySelector('.nombre-prod').innerText,
                precio: parseFloat(el.querySelector('.precio-prod').innerText.replace('S/ ', ''))
            });
        });
        document.getElementById('cart-count').innerText = carrito.length;
        const total = carrito.reduce((s, p) => s + p.precio, 0);
        document.getElementById('cart-total').innerText = `S/ ${total.toFixed(2)}`;
        document.getElementById('whatsapp-btn').style.display = carrito.length > 0 ? 'block' : 'none';
    }

    function enviarPedido() {
        let m = "Hola Alex Store! 👋 Deseo adquirir:\n\n";
        carrito.forEach(p => m += `⭐ *${p.nombre}* - S/ ${p.precio}\n`);
        window.open(`https://wa.me/51918600000?text=${encodeURIComponent(m)}`, '_blank');
    }

    window.onscroll = () => {
        document.getElementById("back-to-top").classList.toggle("show", window.scrollY > 400);
    };
</script>
</body>
</html>
